name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (x.y.z)
        required: true
        type: string
      min_version:
        description: Oldest app version allowed to run (optional x.y.z)
        required: false
        type: string
      security:
        description: Mark this as a security update
        required: true
        default: false
        type: boolean

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'version must be x.y.z' >&2; exit 1; }
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: node --test apps/desktop/ui/hero/tests/*.test.mjs apps/desktop/ui/overlay/tests/*.test.mjs install/tests/*.test.mjs
      - run: sh -n install/install.sh

  build:
    needs: test
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - name: Require committed updater public key
        run: |
          pub=apps/desktop/src-tauri/updater.pub
          [ -s "$pub" ] && ! grep -q '^REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY$' "$pub" || {
            echo 'Commit the generated Tauri updater public key before releasing.' >&2
            exit 1
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Build installer archive
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: scripts/package.sh "$VERSION" "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-unsigned-${{ matrix.target }}
          path: dist/${{ inputs.version }}/
          if-no-files-found: error

  # No checkout or repository scripts execute with the private key available.
  sign:
    needs: build
    runs-on: macos-14
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-unsigned-*
          path: unsigned
          merge-multiple: true
      - run: cargo install tauri-cli --version 2.12.2 --locked
      - name: Sign both updater archives
        env:
          VERSION: ${{ inputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo 'TAURI_SIGNING_PRIVATE_KEY is empty' >&2; exit 1; }
          for arch in aarch64 x86_64; do
            file="unsigned/Clash.of.Meat_${VERSION}_${arch}.app.tar.gz"
            [ -s "$file" ] || { echo "missing $file" >&2; exit 1; }
            cargo tauri signer sign --app-version "$VERSION" "$file" >/dev/null
            [ -s "$file.sig" ] || { echo "missing $file.sig" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-signatures
          path: unsigned/*.sig
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/${{ inputs.version }}
          merge-multiple: true
      - name: Publish release assets, then pointers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MIN_VERSION: ${{ inputs.min_version }}
          SECURITY: ${{ inputs.security }}
        run: |
          set -euo pipefail
          tag="desktop-v$VERSION"
          refs=$(git ls-remote --tags origin "refs/tags/$tag")
          [ -z "$refs" ] || { echo "tag $tag already exists" >&2; exit 1; }
          dist="dist/$VERSION"
          args=()
          if [ -n "$MIN_VERSION" ]; then args+=(--min-version "$MIN_VERSION"); fi
          if [ "$SECURITY" = true ]; then args+=(--security); fi
          scripts/update-manifest.sh "$dist" "$VERSION" "https://github.com/PromptWar/clashofmeat-client/releases/download/$tag/" "${args[@]}"
          gh release create "$tag" \
            "$dist"/*.app.tar.gz "$dist"/*.app.tar.gz.sha256 "$dist"/*.app.tar.gz.sig \
            install/install.sh#install.sh \
            --title "$tag" --notes "Clash of Meat desktop $VERSION" --target "$GITHUB_SHA"
          gh release upload "$tag" "$dist/manifest.json" "$dist/update.json"
