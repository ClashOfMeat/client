name: Audit
# RustSec advisories appear without any commit here, so scan both lock files weekly and whenever they change.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths: ["Cargo.lock", "apps/desktop/src-tauri/Cargo.lock"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with: { tool: cargo-audit }
      - run: cargo audit && cargo audit --file apps/desktop/src-tauri/Cargo.lock
