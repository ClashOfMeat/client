name: Release
# Actions ▸ Release on dev: bumps the version, fast-forwards main, then builds, signs and publishes desktop-v<version>
# with scripts/release.sh (docs/building.md). The web app serves the latest release within five minutes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Increment from the latest desktop release (the first release uses Cargo.toml's version)
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - run: '[[ "$GITHUB_REF" == refs/heads/dev ]] || { echo "Release from dev only."; exit 1; }'
      # Keeps its credentials: this job pushes the version commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - id: bump
        env: { BUMP: "${{ inputs.bump }}" }
        run: |
          latest=$(git tag -l 'desktop-v*' --sort=-v:refname | head -1)
          if [[ -z $latest ]]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          else
            IFS=. read -r major minor patch <<< "${latest#desktop-v}"
            case $BUMP in
              major) version=$((major + 1)).0.0 ;;
              minor) version=$major.$((minor + 1)).0 ;;
              *) version=$major.$minor.$((patch + 1)) ;;
            esac
          fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $version"; exit 1; }
          # The daemon reports Cargo's version to the app and Tauri's to the updater, so both move together.
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml apps/desktop/src-tauri/Cargo.toml
          sed -i "0,/\"version\": \"[^\"]*\"/s//\"version\": \"$version\"/" apps/desktop/src-tauri/tauri.conf.json
          cargo update --workspace
          cargo update --workspace --manifest-path apps/desktop/src-tauri/Cargo.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/tauri.conf.json
          git diff --cached --quiet || git commit -m "Release desktop $version"
          # main only ever fast-forwards to a released dev commit; a commit made directly on main makes this push fail.
          git push --atomic origin HEAD:dev HEAD:main
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: macos-latest
    # The updater signing key lives only in this environment, which waits for a reviewer's approval.
    environment: release
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ needs.version.outputs.sha }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc
          rustup component add clippy
          brew install llvm lld nsis
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-xwin
          key: release-tools-${{ runner.os }}-tauri-2.12.2-v1
      - run: |
          command -v cargo-tauri || cargo install tauri-cli --version 2.12.2 --locked
          command -v cargo-xwin || cargo install --locked cargo-xwin
      - name: Build, sign and publish
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          XWIN_ACCEPT_LICENSE: "1"
          VERSION: ${{ needs.version.outputs.version }}
        run: scripts/release.sh "$VERSION" --app https://app.clashofmeat.com
