name: CI macOS
# scripts/check.sh on macOS, only for pull requests that touch macOS code: GitHub's macOS runners queue (and sometimes
# never start) under load, so UI-, core- and docs-only changes stay on the Linux job in ci.yaml.
on:
  pull_request:
    paths:
      - "apps/desktop/src-tauri/**"
      - "crates/cli/**"
      - "crates/daemon/**"
      - "install/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/check.sh"
      - ".github/workflows/ci-macos.yaml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    # macOS: the LaunchAgent, the desktop app (linted here only) and the .app installer path.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24 }
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: scripts/check.sh
