<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clash of Meat</title>
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <main>
    <section id="update-required" class="update-required" hidden>
      <h2>Update required</h2>
      <p>This version of Clash of Meat must be updated.</p>
      <button id="required-install" hidden>Update and restart</button>
      <p id="required-error" class="error" role="alert" hidden></p>
      <button id="required-retry" hidden>Try again</button>
      <p class="muted">Your activity is still collected.</p>
    </section>
    <section>
      <h2>Account</h2>
      <div id="account-status">Loading…</div>
      <div id="device" class="muted"></div>
      <div class="account-actions"><button id="connect" hidden>Connect</button><button id="sync">Sync now</button><span id="last-sync" class="muted"></span></div>
      <div id="pair-code" class="pair-code" hidden></div>
    </section>
    <section>
      <div class="section-heading"><h2>Providers</h2><span id="today-total" class="muted" hidden></span></div>
      <div id="providers" class="providers"></div>
    </section>
    <section>
      <h2>Hero</h2>
      <div class="hero-settings"><label for="show-hero">Show hero</label><input id="show-hero" type="checkbox"><label for="stay-still">Stop walking</label><input id="stay-still" type="checkbox"><label for="screen">Screen</label><select id="screen"><option value="main">Main screen</option><option value="cursor">Follow cursor</option></select></div>
    </section>
    <section class="about"><h2>About</h2><span id="about-line"></span><button id="about-action" hidden></button></section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="./settings.mjs"></script>
</body>
</html>
