<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clash of Meat hero</title>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <canvas id="hero" aria-label="Clash of Meat hero"></canvas>
  <div id="visit-label" class="visit-label" hidden></div>
  <div id="stats" class="bubble" hidden>
    <div id="card">
      <div id="name"></div>
      <div class="xp-row">
        <div id="xp-text"></div>
        <div class="xp-track"><div id="xp-fill"></div><span id="xp-count"></span></div>
      </div>
      <div id="emotes" class="emotes"></div>
      <div class="card-actions">
        <button id="send-friend" class="wide">Send to a friend →</button>
        <button id="open-app" aria-label="Open Clash of Meat" title="Open Clash of Meat">↗</button>
      </div>
    </div>
    <div id="friends" class="friends" hidden>
      <div class="friends-head"><button id="friends-back" class="back" aria-label="Back to the hero card">‹</button>Send to a friend</div>
      <div id="friends-note" class="friends-note" hidden></div>
      <div id="friends-list" class="friends-list"></div>
      <button id="friends-open" class="wide" hidden>Open Clash of Meat →</button>
    </div>
  </div>
  <div id="menu" class="bubble menu" hidden>
    <button id="pause">Hide hero</button>
    <button id="still">Stop walking</button>
    <button id="settings">Settings…</button>
    <button id="quit">Quit Clash of Meat</button>
  </div>
  <script type="module" src="./overlay.mjs"></script>
</body>
</html>
