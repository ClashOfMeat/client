<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clash of Meat hero</title>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <canvas id="hero" aria-label="Clash of Meat hero"></canvas>
  <button id="levelup" class="levelup" hidden aria-label="Level up: evolve your hero"><canvas id="levelup-text"></canvas></button>
  <div id="stats" class="bubble" hidden>
    <div id="name"></div>
    <div id="xp-text"></div>
    <div class="xp-track"><div id="xp-fill"></div></div>
    <div class="info"><span id="providers"></span><span id="tokens" hidden></span></div>
    <button id="evolve" class="evolve" hidden></button>
    <div id="emotes" class="emotes"></div>
  </div>
  <div id="menu" class="bubble menu" hidden>
    <button id="pause">Hide hero <span class="key">⌃⌥H</span></button>
    <button id="still">Stop walking</button>
    <button disabled>Settings</button>
    <button id="quit">Quit Clash of Meat</button>
  </div>
  <script type="module" src="./overlay.mjs"></script>
</body>
</html>
