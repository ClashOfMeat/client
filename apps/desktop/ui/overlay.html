<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clash of Meat hero</title>
  <link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <canvas id="hero" aria-label="Clash of Meat hero"></canvas>
  <button id="notification-bell" aria-label="Notifications" title="Notifications" hidden><img src="./assets/bell.png" alt=""><span id="notification-count" class="bell-count" hidden></span></button>
  <div id="visit-label" class="visit-label" hidden></div>
  <div id="stats" class="bubble" hidden>
    <div id="card">
      <div class="card-head"><div id="name"></div><button id="card-bell" class="card-bell" aria-label="Notifications" title="Notifications"><img src="./assets/bell.png" alt=""><span id="card-bell-count" class="bell-count" hidden></span></button></div>
      <div class="xp-row">
        <div id="xp-text"></div>
        <div class="xp-track"><div id="xp-fill"></div><span id="xp-count"></span></div>
      </div>
      <div class="card-actions">
        <button id="send-friend" class="wide">Send emote <img class="pixel-arrow forward" src="./assets/pixel-arrow.svg" alt=""></button>
        <button id="open-app" aria-label="Open Clash of Meat" title="Open Clash of Meat"><img class="pixel-globe" src="./assets/pixel-globe.svg" alt=""></button>
      </div>
      <button id="remove-signs" class="wide" hidden>Remove all signs <span id="sign-count" class="sign-count"></span></button>
    </div>
    <div id="friends" class="friends" hidden>
      <div class="friends-head"><button id="friends-back" class="back" aria-label="Back to the hero card"><img class="pixel-arrow" src="./assets/pixel-arrow.svg" alt=""></button>Send to a friend</div>
      <div id="friends-note" class="friends-note" hidden></div>
      <div id="friends-list" class="friends-list"></div>
      <div id="friends-pager" class="friends-pager" hidden>
        <button id="friends-prev" aria-label="Previous friends"><img class="pixel-arrow" src="./assets/pixel-arrow.svg" alt=""></button>
        <span id="friends-page"></span>
        <button id="friends-next" aria-label="Next friends"><img class="pixel-arrow forward" src="./assets/pixel-arrow.svg" alt=""></button>
      </div>
      <button id="friends-open" class="wide" hidden>Open Clash of Meat <img class="pixel-globe" src="./assets/pixel-globe.svg" alt=""></button>
    </div>
    <div id="sign-step" class="friends" hidden>
      <div class="friends-head"><button id="sign-back" class="back" aria-label="Back to your friends"><img class="pixel-arrow" src="./assets/pixel-arrow.svg" alt=""></button><span id="sign-title" class="sign-title">Review me</span></div>
      <div class="friends-note">Paste a GitHub or GitLab link.</div>
      <input id="sign-url" type="url" placeholder="https://github.com/…/pull/42" spellcheck="false" autocomplete="off" aria-label="Link to review">
      <div id="sign-why" class="sign-why" role="status"></div>
      <button id="sign-send" class="wide" disabled>Plant the sign <img class="pixel-arrow forward" src="./assets/pixel-arrow.svg" alt=""></button>
    </div>
    <div id="notifications" class="notifications" hidden>
      <div class="friends-head"><button id="notifications-back" class="back" aria-label="Back to the hero card"><img class="pixel-arrow" src="./assets/pixel-arrow.svg" alt=""></button>Notifications<button id="notifications-read" class="notifications-read" disabled>Mark as read</button></div>
      <div id="notifications-note" class="notifications-note" role="status" hidden></div>
      <div id="notifications-list" class="notifications-list" aria-label="Notifications"></div>
      <button id="notifications-all" class="wide">View all in Clash of Meat <img class="pixel-globe" src="./assets/pixel-globe.svg" alt=""></button>
    </div>
  </div>
  <div id="menu" class="bubble menu" hidden>
    <button id="pause">Hide hero</button>
    <button id="still">Start walking</button>
    <button id="settings">Settings…</button>
    <button id="feedback">Send feedback…</button>
    <button id="quit">Quit Clash of Meat</button>
  </div>
  <script type="module" src="./overlay.mjs"></script>
</body>
</html>
