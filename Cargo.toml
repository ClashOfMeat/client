[workspace]
resolver = "2"
members = ["crates/core", "crates/providers", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
clashofmeat-core = { path = "crates/core" }
clashofmeat-providers = { path = "crates/providers" }
clashofmeat-daemon = { path = "crates/daemon" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
walkdir = "2"
crossbeam-channel = "0.5"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
